<aside class="hidden h-full w-64 shrink-0 flex-col bg-primary lg:flex">
  <div class="flex h-16 items-center gap-2.5 border-b border-white/10 px-6">
    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/15">
      <svg class="h-4 w-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" />
        <path d="M14 2v6h6" />
      </svg>
    </div>
    <div>
      <div class="font-display text-base font-semibold leading-tight text-white">Resumify</div>
      <div class="font-mono text-xs text-white/50">Admin Panel</div>
    </div>
  </div>

  <nav class="flex flex-1 flex-col gap-1 px-3 py-6">
    <div class="mb-3 px-3 text-xs font-semibold uppercase tracking-widest text-white/40">Navigation</div>
    @for (link of links; track link.screen) {
      <button
        type="button"
        class="group flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-all"
        [class.bg-white/15]="current() === link.screen"
        [class.text-white]="current() === link.screen"
        [class.text-white/60]="current() !== link.screen"
        [class.hover:bg-white/8]="current() !== link.screen"
        [class.hover:text-white]="current() !== link.screen"
        (click)="go(link.screen)"
      >
        @switch (link.icon) {
          @case ('chart') {
            <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 3v18h18" />
              <path d="M18 17V9" />
              <path d="M13 17V5" />
              <path d="M8 17v-3" />
            </svg>
          }
          @case ('template') {
            <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M3 9h18" />
              <path d="M9 21V9" />
            </svg>
          }
          @case ('users') {
            <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          }
        }
        <span class="flex-1 text-left">{{ link.label }}</span>
        @if (current() === link.screen) {
          <svg class="h-[14px] w-[14px] opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        }
      </button>
    }
  </nav>

  <div class="px-3 pb-6">
    <div class="mb-3 flex items-center gap-3 border-t border-white/10 px-3 pt-4">
      <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/20 text-xs font-semibold text-white">A</div>
      <div class="min-w-0 flex-1">
        <div class="truncate text-sm font-medium text-white">Admin User</div>
        <div class="truncate text-xs text-white/40">admin&#64;resumify.ai</div>
      </div>
    </div>
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-white/60 transition-all hover:bg-white/8 hover:text-white"
      (click)="go('login')"
    >
      <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      </svg>
      Sign Out
    </button>
  </div>
</aside>
